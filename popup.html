<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Entry Pro v1.2.3</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-card">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <h1>Data Entry Pro</h1>
          <span class="subtitle">Claims Form Automation</span>
        </div>
      </div>
      <span class="badge" id="versionBadge">v1.2.3</span>
    </header>

    <!-- Live GitHub Update Available Banner -->
    <div id="updateBanner" class="update-banner hidden">
      <div class="update-info">
        <span class="update-icon">🔔</span>
        <span id="updateText">New version available!</span>
      </div>
      <a id="updateLink" href="https://github.com/0001marketingguru/data-entry-pro/releases" target="_blank" class="update-action">View Release</a>
    </div>

    <!-- Live Table Detection Banner -->
    <div id="detectionBox" class="detection-banner">
      <span class="pulse-dot"></span>
      <span id="detectionText">Scanning claim table...</span>
    </div>

    <!-- Primary Quick-Action -->
    <div class="action-stack">
      <button id="approveAllUnifiedBtn" class="btn btn-primary">
        <span class="btn-icon">⚡</span>
        <span id="approveAllUnifiedLabel">Full Auto-Approve (All 4 Tiers)</span>
      </button>

      <div class="btn-group">
        <button id="approveTableOnlyBtn" class="btn btn-secondary">
          <span id="approveTableOnlyLabel">Approve Table Only</span>
        </button>
        <button id="checkRadiosOnlyBtn" class="btn btn-secondary">
          Check (3) Radios Only
        </button>
      </div>
    </div>

    <!-- Collapsible Custom Indices -->
    <details class="custom-details" id="customDetails">
      <summary class="custom-summary">
        <span>Target Specific Rows (Optional)</span>
        <span class="summary-arrow">▾</span>
      </summary>
      <div class="custom-body">
        <div class="input-container">
          <input 
            type="text" 
            id="indicesInput" 
            placeholder="e.g. 2, 3, 4, 5" 
          />
          <button id="approveCustomBtn" class="btn btn-sm btn-primary">Run</button>
        </div>
        <p class="hint">Leave empty to auto-target all detected rows.</p>
      </div>
    </details>

    <!-- Live Status Console -->
    <div id="statusBox" class="status-box hidden">
      <div class="status-header">
        <span class="status-indicator"></span>
        <span id="statusTitle">Ready</span>
      </div>
      <div id="statusMessage" class="status-body">No actions executed yet.</div>
    </div>

    <!-- Diagnostic Copy Tool for Testing -->
    <div class="diagnostic-bar">
      <button id="copyDiagnosticBtn" class="btn btn-sm btn-outline">
        <span>📋</span> Copy Diagnostic Log for AI
      </button>
      <span id="copySuccessMsg" class="copy-success hidden">Copied to clipboard!</span>
    </div>

    <!-- Shortcut Hint -->
    <footer class="footer">
      <span>Shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd> (Full 4-Tier Approval)</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
