<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Entry Pro v1.1.1</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-card">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <h1>Data Entry Pro</h1>
          <span class="subtitle">Claims Form Automation</span>
        </div>
      </div>
      <span class="badge">v1.1.1</span>
    </header>

    <!-- Live Table Detection Banner -->
    <div id="detectionBox" class="detection-banner">
      <span class="pulse-dot"></span>
      <span id="detectionText">Scanning claim table...</span>
    </div>

    <!-- Primary Quick-Action (Style A) -->
    <div class="action-stack">
      <button id="approveAllUnifiedBtn" class="btn btn-primary">
        <span class="btn-icon">⚡</span>
        <span id="approveAllUnifiedLabel">Approve All Rows & Checklist</span>
      </button>

      <div class="btn-group">
        <button id="approveTableOnlyBtn" class="btn btn-secondary">
          <span id="approveTableOnlyLabel">Approve Table Only</span>
        </button>
        <button id="checkRadiosOnlyBtn" class="btn btn-secondary">
          Check (3) Radios Only
        </button>
      </div>
    </div>

    <!-- Collapsible / Advanced Custom Indices -->
    <details class="custom-details" id="customDetails">
      <summary class="custom-summary">
        <span>Target Specific Rows (Optional)</span>
        <span class="summary-arrow">▾</span>
      </summary>
      <div class="custom-body">
        <div class="input-container">
          <input 
            type="text" 
            id="indicesInput" 
            placeholder="e.g. 2, 3, 4, 5" 
          />
          <button id="approveCustomBtn" class="btn btn-sm btn-primary">Run</button>
        </div>
        <p class="hint">Leave empty to auto-target all detected rows.</p>
      </div>
    </details>

    <!-- Live Status Console -->
    <div id="statusBox" class="status-box hidden">
      <div class="status-header">
        <span class="status-indicator"></span>
        <span id="statusTitle">Ready</span>
      </div>
      <div id="statusMessage" class="status-body">No actions executed yet.</div>
    </div>

    <!-- Shortcut Hint -->
    <footer class="footer">
      <span>Shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd> (Runs Approve All)</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
